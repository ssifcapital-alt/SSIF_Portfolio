services:
  - type: web
    name: ssif-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: WEBULL_APP_KEY
        sync: false
      - key: WEBULL_APP_SECRET
        sync: false
      - key: WEBULL_ACCOUNT_ID
        sync: false
      - key: WEBULL_ENDPOINT
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
